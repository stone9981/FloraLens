name: flora_lens
description: "花识 FloraLens —— 拍照识花、AI 生成植物档案、一键出分享卡片。"
publish_to: 'none'

version: 1.3.5+18

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1
  dio: ^5.11.1
  image_picker: ^1.2.3
  camera: ^0.12.1
  permission_handler: ^13.0.2
  share_plus: ^13.3.0
  gal: ^2.3.3
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.1
  # 配置导入：从手机任意目录里选一份导出的 JSON
  file_picker: ^13.1.0
  # 打开第三方注册页（Agnes 等），省掉手动复制链接
  url_launcher: ^6.3.2
  # 地理定位水印：取市/区级别位置写进水印（需在设置里手动开启）
  geolocator: ^13.0.0
  # 逆地理编码：经纬度 → 市/区地名
  geocoding: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/data/common_plants.json
